name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Bundler settings previously provided by ruby/setup-ruby's bundler-cache
  BUNDLE_PATH: vendor/bundle
  BUNDLE_JOBS: "4"
  BUNDLE_RETRY: "3"
  BUNDLE_FROZEN: "true"

jobs:
  bundler-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mise
      - run: mise run lint:bundler-audit

  brakeman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mise
      - run: mise run lint:brakeman

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mise
      - run: mise run lint:rubocop

  rspec:
    runs-on: ubuntu-latest

    # https://docs.github.com/en/free-pro-team@latest/actions/guides/about-service-containers#creating-service-containers
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
      postgres:
        image: postgres:13-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: test
          POSTGRES_PASSWORD: secret

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mise
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Run RSpec
        env:
          DATABASE_URL: "postgresql://postgres:secret@localhost/test"
          RAILS_ENV: test
          PERCY_TOKEN: ${{secrets.PERCY_TOKEN}}
        run: |
          bundle exec rake db:schema:load
          pnpm exec percy exec -- bundle exec rspec

      - uses: actions/upload-artifact@v4
        with:
          name: "Test Coverage"
          path: coverage/
