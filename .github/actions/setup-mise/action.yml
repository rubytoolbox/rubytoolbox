name: Setup toolchain
description: Install mise-managed tools (ruby, node, pnpm) and gems with caching

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4
      with:
        # No version input: always installs the latest official mise release
        cache: true
        # mise-action keys its cache on the mise config files; include the
        # idiomatic version files explicitly so ruby/node bumps bust the cache
        cache_key_prefix: mise-v1-${{ hashFiles('.ruby-version', '.node-version') }}
    - uses: actions/cache@v4
      with:
        path: vendor/bundle
        # Native extensions locate libruby through the absolute path of the
        # ruby install they were built with, which differs per ruby version.
        # The ruby version is part of the restore-keys prefix so gems are never
        # restored across ruby versions.
        key: gems-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-${{ hashFiles('Gemfile.lock') }}
        restore-keys: gems-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-
    - run: bundle install
      shell: bash
